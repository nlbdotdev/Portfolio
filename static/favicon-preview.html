<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Favicon test — NLB.DEV</title>
    <link id="favicon" rel="icon" type="image/png" href="/favicon-turtle.png" />
    <style>
      body { background: #191c1a; color: #efeee8; font: 16px system-ui; max-width: 600px; margin: 60px auto; padding: 24px; }
      button { padding: 12px 18px; cursor: pointer; margin: 0 8px 20px 0; }
      button[aria-pressed="true"] { outline: 3px solid #ef9169; }
      img { display: block; width: 180px; height: 180px; }
      a { color: #ef9169; }
    </style>
  </head>
  <body>
    <h1>Favicon test</h1>
    <p>Choose a version and check this browser tab’s icon.</p>
    <button data-icon="favicon-turtle.png" aria-pressed="true">Color</button>
    <button data-icon="favicon-turtle-bw.png" aria-pressed="false">Black & white</button>
    <img id="preview" src="/favicon-turtle.png" alt="Turtle favicon preview" />
    <p><a href="/">Back to portfolio</a></p>
    <script>
      document.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          const src = '/' + button.dataset.icon;
          document.querySelector('#favicon').href = src;
          document.querySelector('#preview').src = src;
          document.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
        });
      });
    </script>
  </body>
</html>
